on: [push]

jobs:
  ubuntu20:
    runs-on: ubuntu-latest
    name: Test on Ubuntu 20.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Compile and test
      uses: ./.github/actions/ubuntu20
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        path: |
          graphicscache.tar.gz
          graphicscache.pdf
          graphicscache.sty
  ubuntu24:
    runs-on: ubuntu-latest
    name: Test on Ubuntu 24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Compile and test
      uses: ./.github/actions/ubuntu24
  ubuntu26:
    runs-on: ubuntu-latest
    name: Test on Ubuntu 26.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Compile and test
      uses: ./.github/actions/ubuntu26
  windows_miktex:
    runs-on: windows-2022
    name: Test on Windows using MikTeX
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Compile and test
      uses: ./.github/actions/windows
  windows_texlive:
    runs-on: windows-2022
    name: Test on Windows using TeX Live
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Compile and test
      uses: ./.github/actions/windows_texlive

 
